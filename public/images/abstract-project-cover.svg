<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Abstract software project cover</title>
  <desc id="description">Blue geometric shapes, a grid, and connecting nodes.</desc>
